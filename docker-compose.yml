services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cms-backend
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      BEHIND_PROXY: "true"
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-3306};Database=${DB_NAME:-cmsdb};User ID=${DB_USER:-cmsdbuser};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env};SslMode=${DB_SSL_MODE:-Preferred}"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      DATA_PROTECTION_KEYS_PATH: /var/lib/adminclinic/dataprotection
    volumes:
      - cms_uploads:/app/wwwroot
      - cms_dataprotection:/var/lib/adminclinic/dataprotection
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5000"
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./front end
      dockerfile: Dockerfile
    container_name: cms-frontend
    expose:
      - "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  cms_uploads:
  cms_dataprotection:

